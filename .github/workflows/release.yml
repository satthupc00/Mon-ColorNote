# Mỗi lần push mà "version" trong package.json là bản chưa phát hành:
# tự build bản PC (Windows) + Android rồi tạo GitHub Release vX.Y.Z.
name: Release
on:
  push:
    branches: ['**']
    paths: ['package.json', '.github/workflows/release.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency: release

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.v.outputs.tag }}
      go: ${{ steps.v.outputs.go }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  windows:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vite build
      - run: npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml

  android:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.check.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npx vite build
      - run: npx cap sync android
      - name: Giải mã khoá ký (GitHub Secrets)
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ] || [ -z "$KS_PASS" ]; then echo "::error::Thiếu secret ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD"; exit 1; fi
          echo "$KS_B64" | base64 -d > "$RUNNER_TEMP/mondiro.jks"
          echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/mondiro.jks" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "::add-mask::$KS_PASS"
      - name: Build APK
        shell: bash
        run: |
          VER="${TAG#v}"
          cd android && chmod +x gradlew && ./gradlew assembleRelease -PappVersion="$VER" --no-daemon
          mkdir -p ../out && cp app/build/outputs/apk/release/app-release.apk "../out/Mon-TriNote-$VER.apk"
      - uses: actions/upload-artifact@v4
        with: { name: android, path: out/*.apk }

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    env: { TAG: '${{ needs.check.outputs.tag }}' }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { path: dist-all, merge-multiple: true }
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: Mon TriNote ${{ env.TAG }}
          body_path: release-notes/${{ env.TAG }}.md
          make_latest: true
          files: dist-all/*
